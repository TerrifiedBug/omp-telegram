name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: publish omp-telegram to npm
    if: github.repository == 'TerrifiedBug/omp-telegram'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require tag to match package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        run: npm publish --provenance --access public
